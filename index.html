<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Explorer - Unique Fluid Mesh Edition</title>
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ================= THEME VARIABLES ================= */
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #E6DAC8;
            --text-color: #2c241d;
            --card-bg: rgba(255, 255, 255, 0.3);
            --border-color: rgba(44, 36, 29, 0.15);
        }

        /* ================= INDIVIDUAL BUTTON COLOR PROFILES ================= */
        [data-theme="dark"] .btn-science { --b: #00d2ff; --g: linear-gradient(135deg, #005c8a 0%, #00d2ff 50%, #79dcff 100%); --s: rgba(0, 210, 255, 0.6); }
        [data-theme="dark"] .btn-history { --b: #d4af37; --g: linear-gradient(135deg, #8a731d 0%, #d4af37 50%, #f3e5ab 100%); --s: rgba(212, 175, 55, 0.6); }
        [data-theme="dark"] .btn-technology { --b: #6a11cb; --g: linear-gradient(135deg, #6a11cb 0%, #2575fc 50%, #00d2ff 100%); --s: rgba(101, 126, 255, 0.6); }
        [data-theme="dark"] .btn-space { --b: #9b51e0; --g: linear-gradient(135deg, #4b134f 0%, #9b51e0 50%, #e056fd 100%); --s: rgba(155, 81, 224, 0.6); }
        [data-theme="dark"] .btn-nature { --b: #27ae60; --g: linear-gradient(135deg, #104f2b 0%, #27ae60 50%, #2ecc71 100%); --s: rgba(39, 174, 96, 0.6); }
        [data-theme="dark"] .btn-future { --b: #00ffcc; --g: linear-gradient(135deg, #008f7a 0%, #00ffcc 50%, #80ffec 100%); --s: rgba(0, 255, 204, 0.6); }
        [data-theme="dark"] .btn-film { --b: #ff5252; --g: linear-gradient(135deg, #8b0000 0%, #ff5252 50%, #ff8686 100%); --s: rgba(255, 82, 82, 0.6); }
        [data-theme="dark"] .btn-food { --b: #ffa502; --g: linear-gradient(135deg, #b35900 0%, #ffa502 50%, #ffbe76 100%); --s: rgba(255, 165, 2, 0.6); }
        [data-theme="dark"] .btn-mythology { --b: #f1c40f; --g: linear-gradient(135deg, #947806 0%, #f1c40f 50%, #f7dc6f 100%); --s: rgba(241, 196, 15, 0.6); }
        [data-theme="dark"] .btn-ocean { --b: #00a8ff; --g: linear-gradient(135deg, #00487c 0%, #00a8ff 50%, #70c7ff 100%); --s: rgba(0, 168, 255, 0.6); }
        [data-theme="dark"] .btn-architecture { --b: #95a5a6; --g: linear-gradient(135deg, #4d5656 0%, #95a5a6 50%, #bdc3c7 100%); --s: rgba(149, 165, 166, 0.6); }
        [data-theme="dark"] .btn-mind { --b: #a55eea; --g: linear-gradient(135deg, #4b387a 0%, #a55eea 50%, #d1b3ff 100%); --s: rgba(165, 94, 234, 0.6); }
        [data-theme="dark"] .btn-sports { --b: #2ecc71; --g: linear-gradient(135deg, #145a32 0%, #2ecc71 50%, #58d68d 100%); --s: rgba(46, 204, 113, 0.6); }
        [data-theme="dark"] .btn-wildlife { --b: #27ae60; --g: linear-gradient(135deg, #196f3d 0%, #27ae60 50%, #52be80 100%); --s: rgba(39, 174, 96, 0.6); }
        [data-theme="dark"] .btn-wildfacts { --b: #ff4757; --g: linear-gradient(135deg, #c0392b 0%, #ff4757 50%, #ff6b81 100%); --s: rgba(255, 71, 87, 0.6); }

        [data-theme="light"] .btn-science { --b: #0284c7; --g: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); --s: rgba(2, 132, 199, 0.4); }
        [data-theme="light"] .btn-history { --b: #92400e; --g: linear-gradient(135deg, #b45309 0%, #92400e 100%); --s: rgba(146, 64, 14, 0.4); }
        [data-theme="light"] .btn-technology { --b: #4338ca; --g: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); --s: rgba(67, 56, 202, 0.4); }
        [data-theme="light"] .btn-space { --b: #6d28d9; --g: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); --s: rgba(109, 40, 217, 0.4); }
        [data-theme="light"] .btn-nature { --b: #166534; --g: linear-gradient(135deg, #15803d 0%, #166534 100%); --s: rgba(22, 101, 52, 0.4); }
        [data-theme="light"] .btn-future { --b: #047857; --g: linear-gradient(135deg, #059669 0%, #047857 100%); --s: rgba(4, 120, 87, 0.4); }
        [data-theme="light"] .btn-film { --b: #b91c1c; --g: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); --s: rgba(185, 28, 28, 0.4); }
        [data-theme="light"] .btn-food { --b: #c2410c; --g: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); --s: rgba(194, 65, 12, 0.4); }
        [data-theme="light"] .btn-mythology { --b: #92400e; --g: linear-gradient(135deg, #b45309 0%, #92400e 100%); --s: rgba(146, 64, 14, 0.4); }
        [data-theme="light"] .btn-ocean { --b: #0369a1; --g: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); --s: rgba(3, 105, 161, 0.4); }
        [data-theme="light"] .btn-architecture { --b: #334155; --g: linear-gradient(135deg, #475569 0%, #334155 100%); --s: rgba(51, 65, 85, 0.4); }
        [data-theme="light"] .btn-mind { --b: #6b21a8; --g: linear-gradient(135deg, #7e22ce 0%, #6b21a8 100%); --s: rgba(107, 33, 168, 0.4); }
        [data-theme="light"] .btn-sports { --b: #166534; --g: linear-gradient(135deg, #15803d 0%, #166534 100%); --s: rgba(22, 101, 52, 0.4); }
        [data-theme="light"] .btn-wildlife { --b: #14532d; --g: linear-gradient(135deg, #166534 0%, #14532d 100%); --s: rgba(20, 83, 45, 0.4); }
        [data-theme="light"] .btn-wildfacts { --b: #b91c1c; --g: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); --s: rgba(185, 28, 28, 0.4); }

        /* ================= BASE STYLES & TYPOGRAPHY ================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header h1 {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #ff6b81;
            text-shadow: 2px 2px 0px rgba(255, 234, 167, 0.4);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        header p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-color);
            opacity: 0.85;
            margin: 0;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

        /* ================= TOP RIGHT TOGGLE ================= */
        .theme-toggle-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
        }

        .theme-toggle-btn {
            font-family: 'Inter', sans-serif;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            border-color: #ff6b81;
            box-shadow: 0 0 15px rgba(255, 107, 129, 0.4);
        }

        /* ================= DOMAIN GRID & BUTTONS ================= */
        #domain-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            #domain-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            #domain-grid { grid-template-columns: 1fr; }
        }

        .domain-btn {
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--b);
            color: var(--b);
            background: transparent;
            padding: 15px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .domain-btn:hover {
            background: var(--g);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 25px var(--s);
            transform: translateY(-3px);
        }

        /* ================= UNIQUE DOMAIN FLUID MESH BACKGROUNDS & ANIMATION DIRECTIONS ================= */
        .page-view {
            padding: 20px;
        }

        #domain-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0b0f19;
            background-size: 220% 220%;
            overflow: hidden;
        }

        /* 1. Science */
        .domain-science {
            background-image: radial-gradient(at 15% 15%, rgba(0, 92, 138, 0.7) 0px, transparent 50%), radial-gradient(at 85% 85%, rgba(0, 210, 255, 0.4) 0px, transparent 60%);
            animation: fluidDiagUp 14s ease infinite alternate;
        }
        .domain-science #main-fact-text { color: #00d2ff; }
        @keyframes fluidDiagUp { 0% { background-position: 0% 100%; } 100% { background-position: 100% 0%; } }

        /* 2. History */
        .domain-history {
            background-image: radial-gradient(at 80% 20%, rgba(138, 115, 29, 0.7) 0px, transparent 50%), radial-gradient(at 20% 80%, rgba(212, 175, 55, 0.35) 0px, transparent 60%);
            animation: fluidOrbital 18s ease infinite;
        }
        .domain-history #main-fact-text { color: #d4af37; }
        @keyframes fluidOrbital { 0% { background-position: 0% 0%; } 33% { background-position: 100% 0%; } 66% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }

        /* 3. Technology */
        .domain-technology {
            background-image: radial-gradient(at 10% 50%, rgba(106, 17, 203, 0.65) 0px, transparent 50%), radial-gradient(at 90% 50%, rgba(37, 117, 252, 0.4) 0px, transparent 60%);
            animation: fluidHorizontal 12s ease infinite alternate;
        }
        .domain-technology #main-fact-text { color: #2575fc; }
        @keyframes fluidHorizontal { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 4. Space */
        .domain-space {
            background-image: radial-gradient(at 50% 50%, rgba(75, 19, 79, 0.8) 0px, transparent 55%), radial-gradient(at 20% 20%, rgba(155, 81, 224, 0.5) 0px, transparent 65%);
            animation: fluidPulse 16s ease-in-out infinite alternate;
        }
        .domain-space #main-fact-text { color: #e056fd; }
        @keyframes fluidPulse { 0% { background-position: 30% 30%; background-size: 200% 200%; } 100% { background-position: 70% 70%; background-size: 250% 250%; } }

        /* 5. Nature */
        .domain-nature {
            background-image: radial-gradient(at 50% 10%, rgba(16, 79, 43, 0.7) 0px, transparent 50%), radial-gradient(at 50% 90%, rgba(39, 174, 96, 0.4) 0px, transparent 60%);
            animation: fluidVertical 15s ease infinite alternate;
        }
        .domain-nature #main-fact-text { color: #2ecc71; }
        @keyframes fluidVertical { 0% { background-position: 50% 0%; } 100% { background-position: 50% 100%; } }

        /* 6. Future */
        .domain-future {
            background-image: radial-gradient(at 85% 15%, rgba(0, 143, 122, 0.7) 0px, transparent 50%), radial-gradient(at 15% 85%, rgba(0, 255, 204, 0.35) 0px, transparent 60%);
            animation: fluidDiagDown 13s ease infinite alternate;
        }
        .domain-future #main-fact-text { color: #00ffcc; }
        @keyframes fluidDiagDown { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }

        /* 7. Film */
        .domain-film {
            background-image: radial-gradient(at 90% 10%, rgba(139, 0, 0, 0.75) 0px, transparent 50%), radial-gradient(at 10% 90%, rgba(255, 82, 82, 0.4) 0px, transparent 60%);
            animation: fluidCorner 11s ease infinite alternate;
        }
        .domain-film #main-fact-text { color: #ff5252; }
        @keyframes fluidCorner { 0% { background-position: 100% 0%; } 100% { background-position: 0% 100%; } }

        /* 8. Food */
        .domain-food {
            background-image: radial-gradient(at 25% 75%, rgba(179, 89, 0, 0.7) 0px, transparent 50%), radial-gradient(at 75% 25%, rgba(255, 165, 2, 0.4) 0px, transparent 60%);
            animation: fluidWarm 15s ease infinite alternate;
        }
        .domain-food #main-fact-text { color: #ffa502; }
        @keyframes fluidWarm { 0% { background-position: 20% 80%; } 100% { background-position: 80% 20%; } }

        /* 9. Mythology */
        .domain-mythology {
            background-image: radial-gradient(at 40% 40%, rgba(148, 120, 6, 0.7) 0px, transparent 50%), radial-gradient(at 60% 60%, rgba(241, 196, 15, 0.35) 0px, transparent 60%);
            animation: fluidMystic 20s linear infinite;
        }
        .domain-mythology #main-fact-text { color: #f1c40f; }
        @keyframes fluidMystic { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 10. Ocean */
        .domain-ocean {
            background-image: radial-gradient(at 50% 20%, rgba(0, 72, 124, 0.75) 0px, transparent 50%), radial-gradient(at 50% 80%, rgba(0, 168, 255, 0.4) 0px, transparent 60%);
            animation: fluidWave 14s ease-in-out infinite alternate;
        }
        .domain-ocean #main-fact-text { color: #00a8ff; }
        @keyframes fluidWave { 0% { background-position: 0% 30%; } 100% { background-position: 100% 70%; } }

        /* 11. Architecture */
        .domain-architecture {
            background-image: radial-gradient(at 30% 30%, rgba(77, 86, 86, 0.7) 0px, transparent 50%), radial-gradient(at 70% 70%, rgba(149, 165, 166, 0.35) 0px, transparent 60%);
            animation: fluidStruct 16s ease infinite alternate;
        }
        .domain-architecture #main-fact-text { color: #bdc3c7; }
        @keyframes fluidStruct { 0% { background-position: 10% 10%; } 100% { background-position: 90% 90%; } }

        /* 12. Mind */
        .domain-mind {
            background-image: radial-gradient(at 70% 30%, rgba(75, 56, 122, 0.75) 0px, transparent 50%), radial-gradient(at 30% 70%, rgba(165, 94, 234, 0.4) 0px, transparent 60%);
            animation: fluidNebula 17s ease infinite alternate;
        }
        .domain-mind #main-fact-text { color: #a55eea; }
        @keyframes fluidNebula { 0% { background-position: 80% 20%; } 100% { background-position: 20% 80%; } }

        /* 13. Sports */
        .domain-sports {
            background-image: radial-gradient(at 15% 85%, rgba(20, 90, 50, 0.7) 0px, transparent 50%), radial-gradient(at 85% 15%, rgba(46, 204, 113, 0.4) 0px, transparent 60%);
            animation: fluidSport 10s ease infinite alternate;
        }
        .domain-sports #main-fact-text { color: #2ecc71; }
        @keyframes fluidSport { 0% { background-position: 0% 100%; } 100% { background-position: 100% 0%; } }

        /* 14. Wildlife */
        .domain-wildlife {
            background-image: radial-gradient(at 20% 40%, rgba(25, 111, 61, 0.7) 0px, transparent 50%), radial-gradient(at 80% 60%, rgba(82, 190, 128, 0.35) 0px, transparent 60%);
            animation: fluidForest 16s ease infinite alternate;
        }
        .domain-wildlife #main-fact-text { color: #27ae60; }
        @keyframes fluidForest { 0% { background-position: 30% 0%; } 100% { background-position: 70% 100%; } }

        /* 15. Wild Facts */
        .domain-wild_facts {
            background-image: radial-gradient(at 50% 15%, rgba(192, 57, 43, 0.8) 0px, transparent 50%), radial-gradient(at 50% 85%, rgba(255, 71, 87, 0.45) 0px, transparent 60%);
            animation: fluidChaos 9s ease infinite alternate;
        }
        .domain-wild_facts #main-fact-text { color: #ff4757; }
        @keyframes fluidChaos { 0% { background-position: 50% 10%; } 50% { background-position: 90% 90%; } 100% { background-position: 10% 50%; } }


        .domain-header, .fact-focus-container, .footer-link-container {
            position: relative;
            z-index: 2;
        }

        .domain-header {
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
        }

        #domain-title-small {
            font-family: 'Fredoka', cursive, sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            color: #ff6b81;
        }

        .fact-focus-container {
            max-width: 850px;
            margin: 60px auto;
            text-align: center;
            padding: 50px 40px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 90%;
            box-sizing: border-box;
        }

        #main-fact-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 35px;
            transition: color 0.3s ease;
        }

        .footer-link-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .footer-link-container a {
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .footer-link-container a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Top-Right Dark/Light Mode Toggle -->
    <div class="theme-toggle-container">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ Light Mode</button>
    </div>

    <!-- ================= PAGE 1: HOME VIEW ================= -->
    <div id="home-page" class="page-view">
        <header>
            <h1>Satiate your thirst for knowledge :D</h1>
            <p>Select a domain below to dive deep into facts.</p>
        </header>

        <!-- Domain Buttons Container -->
        <div id="domain-grid">
            <button class="domain-btn btn-science" onclick="openDomain('Science')">Science</button>
            <button class="domain-btn btn-history" onclick="openDomain('History')">History</button>
            <button class="domain-btn btn-technology" onclick="openDomain('Technology')">Technology</button>
            <button class="domain-btn btn-space" onclick="openDomain('Space')">Space</button>
            <button class="domain-btn btn-nature" onclick="openDomain('Nature')">Nature</button>
            <button class="domain-btn btn-future" onclick="openDomain('Future')">Future</button>
            <button class="domain-btn btn-film" onclick="openDomain('Film')">Film</button>
            <button class="domain-btn btn-food" onclick="openDomain('Food')">Food</button>
            <button class="domain-btn btn-mythology" onclick="openDomain('Mythology')">Mythology</button>
            <button class="domain-btn btn-ocean" onclick="openDomain('Ocean')">Ocean</button>
            <button class="domain-btn btn-architecture" onclick="openDomain('Architecture')">Architecture</button>
            <button class="domain-btn btn-mind" onclick="openDomain('Mind')">Mind</button>
            <button class="domain-btn btn-sports" onclick="openDomain('Sports')">Sports</button>
            <button class="domain-btn btn-wildlife" onclick="openDomain('Wildlife')">Wildlife</button>
            <button class="domain-btn btn-wildfacts" onclick="openDomain('wild_facts')" style="font-size: 1.4rem;">😈</button>
        </div>
    </div>


    <!-- ================= PAGE 2: DOMAIN VIEW ================= -->
    <div id="domain-page" class="page-view" style="display: none;">
        <div class="domain-header">
            <button class="domain-btn btn-technology" onclick="goHome()" style="padding: 8px 18px; font-size: 0.9rem;">&#8592; Back</button>
            <span id="domain-title-small">Domain Name</span>
        </div>

        <div class="fact-focus-container">
            <h2 id="main-fact-text">Loading fact...</h2>
            <button class="domain-btn btn-technology" onclick="nextFactInDomain()" style="margin: 0 auto;">Next Fact</button>
        </div>

        <div class="footer-link-container">
            <a href="https://www.thesaurus.com" target="_blank">Explore Thesaurus &rarr;</a>
        </div>
    </div>


    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        let currentDomainFacts = [];
        let factIndex = 0;

        function toggleTheme() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('themeToggleBtn');
            const currentTheme = html.getAttribute('data-theme');

            if (currentTheme === 'dark') {
                html.setAttribute('data-theme', 'light');
                toggleBtn.innerText = '🌙 Dark Mode';
            } else {
                html.setAttribute('data-theme', 'dark');
                toggleBtn.innerText = '☀️ Light Mode';
            }
        }

        async function openDomain(domainName) {
            document.getElementById('home-page').style.display = 'none';
            const domainPage = document.getElementById('domain-page');
            
            // Assign the unique domain background & animation class
            domainPage.className = "page-view domain-" + domainName.toLowerCase();
            domainPage.style.display = 'block';

            document.getElementById('domain-title-small').innerText = domainName === 'wild_facts' ? 'WILD FACTS 😈' : domainName.toUpperCase();
            document.getElementById('main-fact-text').innerText = "Loading facts...";

            try {
                const response = await fetch(`/data/${domainName.toLowerCase()}.json`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Handle whether the JSON is a direct array or wrapped inside an object property
                const rawFacts = Array.isArray(data) ? data : (data.facts || data.items || Object.values(data)[0]);

                if (!Array.isArray(rawFacts)) {
                    throw new Error("JSON data format could not be parsed as an array of facts.");
                }

                currentDomainFacts = [...rawFacts].sort(() => Math.random() - 0.5);
                factIndex = 0;
                displayCurrentFact();

            } catch (error) {
                console.error('Error loading domain facts:', error);
                document.getElementById('main-fact-text').innerText = "Oops! Couldn't load facts for this domain.";
            }
        }

        function displayCurrentFact() {
            if (currentDomainFacts.length > 0) {
                document.getElementById('main-fact-text').innerText = currentDomainFacts[factIndex];
            }
        }

        function nextFactInDomain() {
            if (currentDomainFacts.length > 0) {
                factIndex = (factIndex + 1) % currentDomainFacts.length;
                displayCurrentFact();
            }
        }

        function goHome() {
            document.getElementById('domain-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
        }
    </script>
</body>
</html>
